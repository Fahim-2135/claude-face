<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>claude-face</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
  <div id="widget">
    <!-- the five heads: the most urgent session in front, the rest small in the corners -->
    <div id="crew" aria-hidden="true"></div>
    <svg id="badge" viewBox="0 0 100 100" aria-hidden="true">
      <g transform="translate(68 22) scale(.72) translate(-78 -20)">
        <g class="bubble">
          <circle class="accent" cx="78" cy="20" r="10"/>
          <path class="q" d="M74.8 17.2 Q74.8 13.6 78 13.6 Q81.2 13.6 81.2 16.6 Q81.2 18.6 79.4 19.6 Q78 20.5 78 22.3"/>
          <circle class="qdot" cx="78" cy="25.6" r="1.5"/>
        </g>
      </g>
    </svg>
    <svg id="defs" width="0" height="0" aria-hidden="true"></svg>

    <div id="context" title="A session's context is nearly full. Claude will soon compact it and may forget details." hidden></div>

    <div id="usage">
      <div class="usage-track"><div id="usage-fill" class="usage-fill"></div></div>
      <div id="week-track" class="usage-track"><div id="week-fill" class="usage-fill"></div></div>
    </div>

    <div id="controls">
      <button id="btn-mini" title="Mini mode"><span></span></button>
      <button id="btn-hide" title="Hide to tray">&ndash;</button>
    </div>
    <div id="resize" title="Drag to resize"></div>
  </div>

  <div id="dot" title="Show face"><div id="dot-face"></div></div>

  <script src="crew-faces.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
